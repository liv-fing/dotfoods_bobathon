<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Environment Setup — FLIGHT400 Lab · Dot Foods</title>
<link rel="icon" type="image/png" href="img/bob-image.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>

<!-- ═══ THEME TOGGLE ══════════════════════════════════════ -->
<button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle light/dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1"  x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1"  y1="12" x2="3"  y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
  </svg>
</button>

<div class="page-clip">
<canvas id="stars-canvas"></canvas>

<!-- ═══ PAGE HEADER ═══════════════════════════════════════ -->
<section class="hero" style="min-height:18vh;padding-top:4rem;padding-bottom:2rem">
  <div class="hero-badge">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <polygon points="6,0.5 7.5,4.5 12,4.5 8.5,7 9.8,11.5 6,9 2.2,11.5 3.5,7 0,4.5 4.5,4.5" fill="#F0AB00"/>
    </svg>
    IBM Bob · Dot Foods
  </div>
  <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:0.75rem">
    <span class="word-mask"><span class="word-inner" style="--d:200ms">Environment</span></span>&#32;<span class="word-mask"><span class="word-inner word-gold" style="--d:320ms">Setup</span></span>
  </h1>
  <p style="margin-bottom:1.25rem">Complete all steps below before starting the lab exercises.</p>
</section>

<!-- ═══ SETUP CARD ═════════════════════════════════════════ -->
<section class="scroll-section" id="tracks-section" style="padding-top:1rem">
  <div class="tracks-stream" id="tracks-stream">
    <!-- Setup partial is loaded here by app.js -->
  </div>
</section>

<footer>Made with IBM Bob &nbsp;&middot;&nbsp; FLIGHT400 Lab · Dot Foods &nbsp;&middot;&nbsp; IBM i Modernization</footer>

</div><!-- /.page-clip -->

<!-- ═══ STUDENT BADGE ═════════════════════════════════════ -->
<div class="student-badge hidden" id="gf-student-badge" aria-live="polite">
  <div class="student-badge-name" id="student-badge-name"></div>
  <button class="student-badge-clear" id="student-badge-clear" title="Clear selection" aria-label="Clear student selection">✕</button>
</div>

<!-- Load only the setup track -->
<script>window.FLIGHT400_CONFIG = { tracks: ['setup'], collapseSetup: false };</script>
<script src="js/app.js?v=2"></script>
</body>
</html>
